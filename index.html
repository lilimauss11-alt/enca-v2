<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnCa Pro - Slide Edition</title>
    <style>
        :root {
            --icon-red: #b31d35;
            --icon-green: #108a50;
            --neutral-gray: #d1d1d1;
            --error-red: #8b0000;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: -apple-system, sans-serif;
            background: #222;
        }

        #app-container {
            position: relative; width: 100vw; height: 100vh;
        }

        .screen {
            position: absolute; width: 100%; height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; padding: 20px;
            background-size: cover !important; background-position: center !important;
        }

        /* НАЧАЛЬНОЕ ПОЛОЖЕНИЕ */
        #menu-screen { z-index: 2; background: url('bg_menu.png'); transform: translateY(0); }
        #game-screen { z-index: 1; background: url('bg_menu.png'); transform: translateY(100%); }

        /* КОГДА ИГРА АКТИВНА */
        .game-active #menu-screen { transform: translateY(-100%); }
        .game-active #game-screen { transform: translateY(0); z-index: 3; }

        /* НОВАЯ ПАНЕЛЬ НАСТРОЕК (БЕЗ ОБРАМЛЕНИЯ) */
        .settings-card {
            width: 100%; max-width: 420px;
            background: url('card_gray.png') no-repeat center; background-size: 100% 100%;
            padding: 25px; margin: 20px 0;
            display: flex; flex-direction: column; gap: 12px; font-weight: bold;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; color: #000; font-size: 15px; }
        select { border: 1px solid #ccc; background: rgba(255,255,255,0.8); padding: 5px; border-radius: 8px; width: 110px; }

        .menu-btn {
            width: 100%; max-width: 400px; height: 90px; border-radius: 20px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; margin-bottom: 15px;
            gap: 15px; font-weight: bold; font-size: 18px; 
        }
        .btn-ear { background: var(--icon-green); color: white; }
        .btn-classic { background: var(--icon-red); color: white; }
        .btn-write { background: white; border: 3px solid var(--icon-green); color: var(--icon-green); }

        /* ИГРА */
        .stats-container { display: flex; gap: 10px; margin-bottom: 25px; width: 100%; max-width: 600px; }
        .stat-card { 
            flex: 1; height: 55px; background: rgba(255,255,255,0.9); border-radius: 14px; 
            display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold;
        }
        .stat-card img { height: 25px; }

        .card {
            min-height: 90px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            padding: 15px; text-align: center; font-size: 14px; font-weight: 700;
            background: url('card_gray.png') no-repeat center; background-size: 100% 100%;
            color: #333;
        }

        /* ОШИБКА И ТРЯСКА */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
        .is-wrong { 
            outline: 6px solid var(--error-red) !important; 
            outline-offset: -3px;
            border-radius: 18px;
            animation: shake 0.4s;
        }

        .is-correct { background: url('card_en.png') no-repeat center !important; background-size: 100% 100% !important; border-radius: 18px; }
        .selected { filter: brightness(0.8); outline: 4px solid var(--neutral-gray); border-radius: 18px; }
        .matched { opacity: 0.4; pointer-events: none; }

        #writing-mode { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        .write-card { 
            width: 100%; max-width: 500px; padding: 50px 20px; 
            background: url('card_gray.png') no-repeat center; background-size: 100% 100%;
            text-align: center; font-size: 24px; font-weight: bold; color: #000;
        }
        .write-input { 
            width: 100%; max-width: 500px; padding: 20px; border-radius: 15px; border: 2px solid #ccc; 
            font-size: 20px; text-align: center; outline: none; background: #fff;
        }

        .back-menu-btn {
            background: url('card_gray.png') no-repeat center; background-size: 100% 100%;
            padding: 15px 40px; cursor: pointer; font-weight: 900; margin-top: 30px;
        }
        
        .hidden-en { color: transparent !important; position: relative; }
        .hidden-en::after { content: ''; background: url('listen_icon.png') no-repeat center; background-size: contain; width: 35px; height: 35px; position: absolute; }
    </style>
</head>
<body id="body-tag">

    <div id="app-container">
        <!-- ЭКРАН МЕНЮ -->
        <div id="menu-screen" class="screen">
            <div class="menu-title"><span style="color:var(--icon-green)">En</span><span style="color:var(--icon-red)">Ca</span></div>
            <div class="settings-card">
                <div class="setting-row"><span>Скорость:</span><select id="speech-rate"><option value="0.9" selected>Normal</option><option value="1.2">Fast</option></select></div>
                <div class="setting-row"><span>Голос:</span><select id="voice-gender"><option value="female">Female</option><option value="male">Male</option></select></div>
                <div class="setting-row"><span>Язык:</span><select id="ui-lang" onchange="updateLang()"><option value="ru">Русский</option><option value="en">English</option></select></div>
            </div>
            <button class="menu-btn btn-ear" onclick="startGame('listening')">НА СЛУХ</button>
            <button class="menu-btn btn-classic" onclick="startGame('classic')">КЛАССИКА</button>
            <button class="menu-btn btn-write" onclick="startGame('writing')">ПИСЬМО</button>
        </div>

        <!-- ЭКРАН ИГРЫ -->
        <div id="game-screen" class="screen">
            <div id="game-content" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <div class="stats-container">
                    <div class="stat-card"><img src="excellent.png"><span id="correct-count">0</span></div>
                    <div class="stat-card"><img src="bad.png"><span id="wrong-count">0</span></div>
                    <div class="stat-card"><img src="cards_icon.png" style="height:20px;"><span id="pool-count">0</span></div>
                </div>
                
                <div id="matching-columns" style="display:flex; gap:12px; width:100%;">
                    <div id="en-column" style="flex:1; display:flex; flex-direction:column; gap:10px;"></div>
                    <div id="ru-column" style="flex:1; display:flex; flex-direction:column; gap:10px;"></div>
                </div>

                <div id="writing-mode">
                    <div id="target-ru" class="write-card">...</div>
                    <input type="text" id="user-input" class="write-input" placeholder="Type here...">
                </div>

                <div class="back-menu-btn" onclick="backToMenu()">МеНю</div>
            </div>
        </div>
    </div>

    <script>
        // Тестовый набор из 2 слов
        const allWords = [
            { en: "What's up", ru: "Как дела" }, 
            { en: "Not much", ru: "Ничего особенного" }
        ];

        let pool = [], currentGameMode = '', correctCount = 0, wrongCount = 0, selectedCards = [];
        let currentWritingWord = null;

        function updateLang() {
            const lang = document.getElementById('ui-lang').value;
            document.querySelector('.back-menu-btn').textContent = lang === 'ru' ? 'МеНю' : 'Menu';
        }

        function startGame(mode) {
            currentGameMode = mode;
            pool = [...allWords].sort(() => Math.random() - 0.5);
            
            const bgs = { listening: 'bg_listen.png', classic: 'bg_classic.png', writing: 'bg_write.png' };
            document.getElementById('game-screen').style.background = `url('${bgs[mode]}')`;
            
            document.getElementById('body-tag').classList.add('game-active');
            
            if (mode === 'writing') {
                document.getElementById('matching-columns').style.display = 'none';
                document.getElementById('writing-mode').style.display = 'flex';
                nextWritingWord();
            } else {
                document.getElementById('matching-columns').style.display = 'flex';
                document.getElementById('writing-mode').style.display = 'none';
                initMatchingRound();
            }
        }

        function handleCardClick(card) {
            if (card.classList.contains('matched')) return;
            
            const sameLangSelected = selectedCards.find(c => c.dataset.lang === card.dataset.lang);
            if (sameLangSelected) {
                sameLangSelected.classList.remove('selected');
                selectedCards = selectedCards.filter(c => c !== sameLangSelected);
            }

            card.classList.add('selected'); selectedCards.push(card);
            
            if (selectedCards.length === 2) {
                const [c1, c2] = selectedCards;
                if (c1.dataset.pairId === c2.dataset.pairId) {
                    correctCount++; 
                    c1.classList.add('is-correct', 'matched'); 
                    c2.classList.add('is-correct', 'matched');
                } else {
                    wrongCount++; 
                    c1.classList.add('is-wrong'); 
                    c2.classList.add('is-wrong');
                    setTimeout(() => { 
                        c1.classList.remove('selected', 'is-wrong'); 
                        c2.classList.remove('selected', 'is-wrong'); 
                    }, 500);
                }
                selectedCards = [];
                document.getElementById('correct-count').textContent = correctCount;
                document.getElementById('wrong-count').textContent = wrongCount;
                if (document.querySelectorAll('.card:not(.matched)').length === 0 && pool.length > 0) setTimeout(initMatchingRound, 800);
            }
        }

        function initMatchingRound() {
            const enCol = document.getElementById('en-column'); const ruCol = document.getElementById('ru-column');
            enCol.innerHTML = ''; ruCol.innerHTML = '';
            let round = pool.splice(0, 6);
            round.forEach(w => {
                const card = document.createElement('div'); card.className = 'card';
                if (currentGameMode === 'listening') card.classList.add('hidden-en');
                card.textContent = w.en; card.dataset.pairId = w.en; card.dataset.lang = 'en';
                card.onclick = () => handleCardClick(card); enCol.appendChild(card);
            });
            [...round].sort(() => Math.random() - 0.5).forEach(w => {
                const card = document.createElement('div'); card.className = 'card';
                card.textContent = w.ru; card.dataset.pairId = w.en; card.dataset.lang = 'ru';
                card.onclick = () => handleCardClick(card); ruCol.appendChild(card);
            });
            document.getElementById('pool-count').textContent = pool.length;
        }

        function nextWritingWord() {
            if (pool.length === 0) return backToMenu();
            currentWritingWord = pool.pop();
            document.getElementById('target-ru').textContent = currentWritingWord.ru;
            document.getElementById('user-input').value = '';
            document.getElementById('target-ru').classList.remove('is-wrong', 'is-correct');
            document.getElementById('pool-count').textContent = pool.length;
            document.getElementById('user-input').focus();
        }

        // ОБРАБОТКА ENTER В ПИСЬМЕ
        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const card = document.getElementById('target-ru');
                const val = e.target.value.trim().toLowerCase();
                if (val === currentWritingWord.en.toLowerCase()) {
                    correctCount++; 
                    card.classList.add('is-correct'); 
                    setTimeout(nextWritingWord, 600);
                } else {
                    wrongCount++; 
                    card.classList.add('is-wrong');
                    setTimeout(() => card.classList.remove('is-wrong'), 500);
                }
                document.getElementById('correct-count').textContent = correctCount;
                document.getElementById('wrong-count').textContent = wrongCount;
            }
        });

        function backToMenu() {
            document.getElementById('body-tag').classList.remove('game-active');
            setTimeout(() => {
                correctCount = 0; wrongCount = 0;
                document.getElementById('correct-count').textContent = '0';
                document.getElementById('wrong-count').textContent = '0';
            }, 500);
        }
    </script>
</body>
</html>
