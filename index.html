<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EnCa Pro</title>
    <style>
        :root {
            --neutral-gray: #d1d1d1;
            --error-red: #8b0000;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        html, body { 
            margin: 0; padding: 0; 
            height: 100vh; width: 100%;
            overflow: hidden; 
            font-family: -apple-system, sans-serif;
        }

        #body-tag {
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            height: 100vh;
            width: 100%;
            position: fixed;
            top: 0; left: 0;
            transition: background-image 0.3s ease-in-out;
        }

        #app-container { position: relative; width: 100%; height: 100vh; }

        .screen {
            position: absolute; width: 100%; height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; 
            padding: 15px; padding-top: 40px;
        }

        #menu-screen { z-index: 2; transform: translateY(0); }
        #game-screen { z-index: 1; transform: translateY(100%); }
        .game-active #menu-screen { transform: translateY(-100%); }
        .game-active #game-screen { transform: translateY(0); z-index: 3; }

        .menu-title { font-size: 54px; font-weight: 900; margin: 10px 0; letter-spacing: -2px; }
        .t-green { color: #108a50; }
        .t-red { color: #b31d35; }

        .settings-card {
            width: 100%; max-width: 400px;
            background: #fff; border-radius: 20px;
            padding: 15px 25px; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 10px; font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; color: #000; font-size: 15px; }
        select { border: 1px solid #ccc; background: #f9f9f9; padding: 4px; border-radius: 8px; width: 110px; }

        .menu-btn {
            width: 100%; max-width: 380px; height: 80px; border-radius: 20px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; margin-bottom: 15px;
            gap: 15px; font-weight: bold; font-size: 18px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .btn-ear { background: #108a50; color: white; }
        .btn-classic { background: #b31d35; color: white; }
        .btn-write { background: white; border: 3px solid #108a50; color: #108a50; }

        .stats-container { display: flex; gap: 8px; margin-bottom: 15px; width: 100%; max-width: 500px; }
        .stat-card { 
            flex: 1; height: 45px; background: rgba(255,255,255,0.9); border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: bold;
        }
        .stat-card img { height: 20px; }

        /* КАРТОЧКИ С РИСУНКАМИ */
        .card {
            min-height: 75px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            padding: 10px; text-align: center; font-size: 14px; font-weight: 700;
            background: url('card_gray.png') no-repeat center; background-size: 100% 100%;
            color: #333;
        }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
        
        .is-wrong { 
            background: url('card_ru.png') no-repeat center !important; background-size: 100% 100% !important;
            animation: shake 0.4s;
            border-radius: 15px;
        }
        .is-correct { 
            background: url('card_en.png') no-repeat center !important; background-size: 100% 100% !important;
            border-radius: 15px;
        }
        .selected { outline: 4px solid var(--neutral-gray); border-radius: 15px; }
        .matched { opacity: 0.3; pointer-events: none; }

        .action-btn {
            background: #fff; padding: 12px 35px; cursor: pointer; font-weight: 900; 
            margin-top: 15px; border-radius: 15px; box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            font-size: 17px; border: none;
        }

        #writing-mode { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        .write-card { 
            width: 100%; max-width: 400px; padding: 40px 20px; 
            background: url('card_gray.png') no-repeat center; background-size: 100% 100%;
            text-align: center; font-size: 22px; font-weight: bold; color: #000;
        }
        .write-input { 
            width: 100%; max-width: 400px; padding: 15px; border-radius: 15px; border: 2px solid #ccc; 
            font-size: 18px; text-align: center; outline: none; background: #fff;
        }
        
        .hidden-en { color: transparent !important; position: relative; }
        .hidden-en::after { 
            content: ''; background: url('listen_icon.png') no-repeat center; 
            background-size: contain; width: 30px; height: 30px; position: absolute; 
        }
    </style>
</head>
<body id="body-tag" style="background-image: url('bg_menu.png');">

    <div id="app-container">
        <div id="menu-screen" class="screen">
            <div class="menu-title"><span class="t-green">En</span><span class="t-red">Ca</span></div>
            <div class="settings-card">
                <div class="setting-row"><span id="lbl-speed">Скорость:</span>
                    <select id="speech-rate"><option value="0.9" selected>Обычная</option><option value="1.2">Быстрая</option></select>
                </div>
                <div class="setting-row"><span id="lbl-voice">Голос:</span>
                    <select id="voice-gender"><option value="female">Женский</option><option value="male">Мужской</option></select>
                </div>
                <div class="setting-row"><span id="lbl-lang">Язык:</span>
                    <select id="ui-lang" onchange="updateLang()"><option value="ru" selected>Русский</option><option value="en">English</option></select>
                </div>
            </div>
            <button class="menu-btn btn-ear" onclick="startGame('listening')">НА СЛУХ</button>
            <button class="menu-btn btn-classic" onclick="startGame('classic')">КЛАССИКА</button>
            <button class="menu-btn btn-write" onclick="startGame('writing')">ПИСЬМО</button>
        </div>

        <div id="game-screen" class="screen">
            <div id="game-content" style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <div class="stats-container">
                    <div class="stat-card"><img src="excellent.png"><span id="correct-count">0</span></div>
                    <div class="stat-card"><img src="bad.png"><span id="wrong-count">0</span></div>
                    <div class="stat-card"><img src="cards_icon.png"><span id="pool-count">0</span></div>
                </div>
                
                <div id="matching-columns" style="display:flex; gap:10px; width:100%;">
                    <div id="en-column" style="flex:1; display:flex; flex-direction:column; gap:8px;"></div>
                    <div id="ru-column" style="flex:1; display:flex; flex-direction:column; gap:8px;"></div>
                </div>

                <div id="writing-mode">
                    <div id="target-ru" class="write-card">...</div>
                    <input type="text" id="user-input" placeholder="...">
                    <button class="action-btn" onclick="checkWritingAnswer()" id="check-btn"><span class="t-green">Прове</span><span class="t-red">рить</span></button>
                </div>

                <button class="action-btn" onclick="backToMenu()" id="back-btn"><span class="t-green">Ме</span><span class="t-red">Ню</span></button>
            </div>
        </div>
    </div>

    <script>
        const allWords = [{en: "What's up", ru: "Как дела"}, {en: "Not much", ru: "Ничего особенного"}];
        let pool = [], currentGameMode = '', correctCount = 0, wrongCount = 0, selectedCards = [];
        let currentWritingWord = null;

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = parseFloat(document.getElementById('speech-rate').value);
            const gender = document.getElementById('voice-gender').value;
            const voices = window.speechSynthesis.getVoices();
            msg.voice = voices.find(v => v.lang.startsWith('en') && (gender === 'male' ? v.name.includes('Male') : v.name.includes('Female'))) || null;
            window.speechSynthesis.speak(msg);
        }

        function updateLang() {
            const lang = document.getElementById('ui-lang').value;
            const backBtn = document.getElementById('back-btn');
            const checkBtn = document.getElementById('check-btn');
            const speedSelect = document.getElementById('speech-rate');
            const voiceSelect = document.getElementById('voice-gender');

            if (lang === 'ru') {
                document.getElementById('lbl-speed').textContent = 'Скорость:';
                document.getElementById('lbl-voice').textContent = 'Голос:';
                document.getElementById('lbl-lang').textContent = 'Язык:';
                speedSelect.options[0].text = 'Обычная';
                speedSelect.options[1].text = 'Быстрая';
                voiceSelect.options[0].text = 'Женский';
                voiceSelect.options[1].text = 'Мужской';
                backBtn.innerHTML = '<span class="t-green">Ме</span><span class="t-red">Ню</span>';
                checkBtn.innerHTML = '<span class="t-green">Прове</span><span class="t-red">рить</span>';
                document.querySelectorAll('.menu-btn')[0].textContent = 'НА СЛУХ';
                document.querySelectorAll('.menu-btn')[1].textContent = 'КЛАССИКА';
                document.querySelectorAll('.menu-btn')[2].textContent = 'ПИСЬМО';
            } else {
                document.getElementById('lbl-speed').textContent = 'Speed:';
                document.getElementById('lbl-voice').textContent = 'Voice:';
                document.getElementById('lbl-lang').textContent = 'Language:';
                speedSelect.options[0].text = 'Normal';
                speedSelect.options[1].text = 'Fast';
                voiceSelect.options[0].text = 'Female';
                voiceSelect.options[1].text = 'Male';
                backBtn.innerHTML = '<span class="t-green">Me</span><span class="t-red">Nu</span>';
                checkBtn.innerHTML = '<span class="t-green">Ch</span><span class="t-red">eck</span>';
                document.querySelectorAll('.menu-btn')[0].textContent = 'BY EAR';
                document.querySelectorAll('.menu-btn')[1].textContent = 'CLASSIC';
                document.querySelectorAll('.menu-btn')[2].textContent = 'WRITING';
            }
        }

        function startGame(mode) {
            currentGameMode = mode;
            pool = [...allWords].sort(() => Math.random() - 0.5);
            const body = document.getElementById('body-tag');
            if (mode === 'listening') body.style.backgroundImage = "url('bg_listen.png')";
            else if (mode === 'classic') body.style.backgroundImage = "url('bg_classic.png')";
            else if (mode === 'writing') body.style.backgroundImage = "url('bg_write.png')";
            document.getElementById('body-tag').classList.add('game-active');
            if (mode === 'writing') {
                document.getElementById('matching-columns').style.display = 'none';
                document.getElementById('writing-mode').style.display = 'flex';
                nextWritingWord();
            } else {
                document.getElementById('matching-columns').style.display = 'flex';
                document.getElementById('writing-mode').style.display = 'none';
                initMatchingRound();
            }
        }

        function handleCardClick(card) {
            if (card.classList.contains('matched')) return;
            if (card.dataset.lang === 'en') speak(card.dataset.text);
            const sameLangSelected = selectedCards.find(c => c.dataset.lang === card.dataset.lang);
            if (sameLangSelected) {
                sameLangSelected.classList.remove('selected');
                selectedCards = selectedCards.filter(c => c !== sameLangSelected);
            }
            card.classList.add('selected'); selectedCards.push(card);
            if (selectedCards.length === 2) {
                const [c1, c2] = selectedCards;
                if (c1.dataset.pairId === c2.dataset.pairId) {
                    correctCount++; c1.classList.add('is-correct', 'matched'); c2.classList.add('is-correct', 'matched');
                    if (document.querySelectorAll('.card:not(.matched)').length === 0 && pool.length > 0) setTimeout(initMatchingRound, 800);
                } else {
                    wrongCount++; c1.classList.add('is-wrong'); c2.classList.add('is-wrong');
                    setTimeout(() => { c1.classList.remove('selected', 'is-wrong'); c2.classList.remove('selected', 'is-wrong'); }, 500);
                }
                selectedCards = [];
                document.getElementById('correct-count').textContent = correctCount;
                document.getElementById('wrong-count').textContent = wrongCount;
            }
        }

        function initMatchingRound() {
            const enCol = document.getElementById('en-column'); const ruCol = document.getElementById('ru-column');
            enCol.innerHTML = ''; ruCol.innerHTML = '';
            let round = pool.splice(0, 6);
            round.forEach(w => {
                const card = document.createElement('div'); card.className = 'card';
                if (currentGameMode === 'listening') card.classList.add('hidden-en');
                card.textContent = w.en; card.dataset.pairId = w.en; card.dataset.lang = 'en'; card.dataset.text = w.en;
                card.onclick = () => handleCardClick(card); enCol.appendChild(card);
            });
            [...round].sort(() => Math.random() - 0.5).forEach(w => {
                const card = document.createElement('div'); card.className = 'card';
                card.textContent = w.ru; card.dataset.pairId = w.en; card.dataset.lang = 'ru';
                card.onclick = () => handleCardClick(card); ruCol.appendChild(card);
            });
            document.getElementById('pool-count').textContent = pool.length;
        }

        function nextWritingWord() {
            if (pool.length === 0) return backToMenu();
            currentWritingWord = pool.pop();
            document.getElementById('target-ru').textContent = currentWritingWord.ru;
            document.getElementById('user-input').value = '';
            document.getElementById('target-ru').classList.remove('is-wrong', 'is-correct');
            document.getElementById('pool-count').textContent = pool.length;
        }

        function checkWritingAnswer() {
            const card = document.getElementById('target-ru');
            const input = document.getElementById('user-input');
            if (input.value.trim().toLowerCase() === currentWritingWord.en.toLowerCase()) {
                correctCount++; speak(currentWritingWord.en); card.classList.add('is-correct'); setTimeout(nextWritingWord, 600);
            } else {
                wrongCount++; card.classList.add('is-wrong');
                setTimeout(() => card.classList.remove('is-wrong'), 500);
            }
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('wrong-count').textContent = wrongCount;
        }

        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkWritingAnswer();
        });

        function backToMenu() {
            document.getElementById('body-tag').style.backgroundImage = "url('bg_menu.png')";
            document.getElementById('body-tag').classList.remove('game-active');
            setTimeout(() => { correctCount = 0; wrongCount = 0; }, 500);
        }
        window.speechSynthesis.onvoiceschanged = () => {};
    </script>
</body>
</html>
