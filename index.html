<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnCa Pro - Full Flip Edition</title>
    <style>
        :root {
            --icon-red: #b31d35;
            --icon-green: #108a50;
            --neutral-gray: #d1d1d1;
            --error-red: #8b0000;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        /* ГЛОБАЛЬНЫЙ ПЕРЕВОРОТ С ФОНОМ */
        html, body { 
            height: 100%; margin: 0; overflow: hidden; 
            background: #222; /* Технический фон под картой */
        }

        #master-container {
            width: 100%; height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
        }
        .is-flipped { transform: rotateY(180deg); }

        .screen-side {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
            background-size: cover !important; background-position: center !important;
        }

        #menu-side { background: url('bg_menu.png'); }
        #game-side { background: url('bg_menu.png'); transform: rotateY(180deg); }

        /* МЕНЮ */
        #menu-content { width: 100%; max-width: 400px; text-align: center; }
        .menu-title { font-size: 54px; font-weight: 900; margin: 15px 0; letter-spacing: -2px; }
        
        .settings-panel {
            background: url('ui_frame.png') no-repeat center; background-size: 100% 100%;
            padding: 20px 25px; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 8px; font-weight: bold;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; color: #000; font-size: 13px; }
        select { border: 1px solid #ccc; background: rgba(255,255,255,0.8); padding: 3px; border-radius: 6px; width: 90px; }

        .menu-btn {
            width: 100%; height: 90px; border-radius: 20px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; margin-bottom: 15px;
            gap: 15px; font-weight: bold; font-size: 18px; 
        }
        .btn-ear { background: var(--icon-green); color: white; }
        .btn-classic { background: var(--icon-red); color: white; }
        .btn-write { background: white; border: 3px solid var(--icon-green); color: var(--icon-green); }

        /* ИГРА */
        #game-content { width: 100%; max-width: 600px; }
        .stats-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .stat-card { 
            flex: 1; height: 55px; background: rgba(255,255,255,0.9); border-radius: 14px; 
            display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold;
        }
        .stat-card img { height: 25px; }

        .card {
            min-height: 90px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            padding: 15px; text-align: center; font-size: 14px; font-weight: 700;
            background: url('card_gray.png') no-repeat center; background-size: 100% 100%;
            color: #333;
        }

        /* ТОЛЬКО РАМКА СТАНОВИТСЯ КРАСНОЙ */
        .is-wrong { 
            outline: 6px solid var(--error-red) !important; 
            outline-offset: -3px;
            border-radius: 18px;
        }

        .is-correct { background: url('card_en.png') no-repeat center !important; background-size: 100% 100% !important; border-radius: 18px; }
        .selected { filter: brightness(0.8); outline: 4px solid var(--neutral-gray); border-radius: 18px; }
        .matched { opacity: 0.4; pointer-events: none; }

        #writing-mode { display: none; flex-direction: column; align-items: center; gap: 20px; }
        .write-card { 
            width: 100%; padding: 50px 20px; background: url('ui_frame.png') no-repeat center;
            background-size: 100% 100%; text-align: center; font-size: 22px; font-weight: bold; color: #000;
        }
        .write-input { 
            width: 100%; padding: 18px; border-radius: 15px; border: 2px solid #ccc; 
            font-size: 18px; text-align: center; outline: none;
        }

        .back-menu-btn {
            background: url('ui_frame.png') no-repeat center; background-size: 100% 100%;
            padding: 12px 35px; cursor: pointer; font-weight: 900; margin-top: 30px;
        }
    </style>
</head>
<body>

    <div id="master-container">
        <!-- ПЕРЕДНЯЯ СТОРОНА -->
        <div id="menu-side" class="screen-side">
            <div id="menu-content">
                <div class="menu-title"><span style="color:var(--icon-green)">En</span><span style="color:var(--icon-red)">Ca</span></div>
                <div class="settings-panel">
                    <div class="setting-row"><span>Скорость:</span><select id="speech-rate"><option value="0.9" selected>Normal</option><option value="1.2">Fast</option></select></div>
                    <div class="setting-row"><span>Голос:</span><select id="voice-gender"><option value="female">Female</option><option value="male">Male</option></select></div>
                    <div class="setting-row"><span>Язык:</span><select id="ui-lang"><option value="ru">Русский</option><option value="en">English</option></select></div>
                </div>
                <button class="menu-btn btn-ear" onclick="startGame('listening')">НА СЛУХ</button>
                <button class="menu-btn btn-classic" onclick="startGame('classic')">КЛАССИКА</button>
                <button class="menu-btn btn-write" onclick="startGame('writing')">ПИСЬМО</button>
            </div>
        </div>

        <!-- ЗАДНЯЯ СТОРОНА -->
        <div id="game-side" class="screen-side">
            <div id="game-content">
                <div class="stats-container">
                    <div class="stat-card"><img src="excellent.png"><span id="correct-count">0</span></div>
                    <div class="stat-card"><img src="bad.png"><span id="wrong-count">0</span></div>
                    <div class="stat-card"><img src="cards_icon.png" style="height:20px;"><span id="pool-count">0</span></div>
                </div>
                <div id="matching-columns" style="display:flex; gap:10px;"><div id="en-column" style="flex:1; display:flex; flex-direction:column; gap:10px;"></div><div id="ru-column" style="flex:1; display:flex; flex-direction:column; gap:10px;"></div></div>
                <div id="writing-mode"><div id="target-ru" class="write-card">...</div><input type="text" id="user-input" class="write-input" placeholder="..."></div>
                <div style="display:flex; justify-content:center;"><div class="back-menu-btn" onclick="backToMenu()">МеНю</div></div>
            </div>
        </div>
    </div>

    <script>
        // Твой список слов из 171 фразы
        const allWords = [{en:"Hi", ru:"Привет"}, {en:"What's up", ru:"Как дела"}]; 
        let pool = [], currentGameMode = '', correctCount = 0, wrongCount = 0, selectedCards = [];

        function startGame(mode) {
            currentGameMode = mode;
            pool = [...allWords].sort(() => Math.random() - 0.5);
            
            // Смена фона на игровой стороне перед поворотом
            const bgs = { listening: 'bg_listen.png', classic: 'bg_classic.png', writing: 'bg_write.png' };
            document.getElementById('game-side').style.background = `url('${bgs[mode]}')`;
            
            document.getElementById('master-container').classList.add('is-flipped');
            
            if (mode === 'writing') {
                document.getElementById('matching-columns').style.display = 'none';
                document.getElementById('writing-mode').style.display = 'flex';
                nextWritingWord();
            } else {
                document.getElementById('matching-columns').style.display = 'flex';
                document.getElementById('writing-mode').style.display = 'none';
                initMatchingRound();
            }
        }

        function handleCardClick(card) {
            if (card.classList.contains('matched')) return;
            card.classList.add('selected'); selectedCards.push(card);
            
            if (selectedCards.length === 2) {
                const [c1, c2] = selectedCards;
                if (c1.dataset.pairId === c2.dataset.pairId) {
                    correctCount++; c1.classList.add('is-correct', 'matched'); c2.classList.add('is-correct', 'matched');
                } else {
                    wrongCount++; 
                    c1.classList.add('is-wrong'); c2.classList.add('is-wrong'); // КРАСНАЯ РАМКА
                    setTimeout(() => { c1.classList.remove('selected', 'is-wrong'); c2.classList.remove('selected', 'is-wrong'); }, 500);
                }
                selectedCards = [];
                document.getElementById('correct-count').textContent = correctCount;
                document.getElementById('wrong-count').textContent = wrongCount;
            }
        }

        function backToMenu() {
            document.getElementById('master-container').classList.remove('is-flipped');
            correctCount = 0; wrongCount = 0;
            document.getElementById('correct-count').textContent = '0';
            document.getElementById('wrong-count').textContent = '0';
        }

        function initMatchingRound() {
            const enCol = document.getElementById('en-column'); const ruCol = document.getElementById('ru-column');
            enCol.innerHTML = ''; ruCol.innerHTML = '';
            let roundWords = pool.splice(0, 6);
            roundWords.forEach(w => {
                const card = document.createElement('div'); card.className = 'card'; card.textContent = w.en;
                card.dataset.pairId = w.en; card.onclick = () => handleCardClick(card);
                enCol.appendChild(card);
            });
            [...roundWords].sort(() => Math.random() - 0.5).forEach(w => {
                const card = document.createElement('div'); card.className = 'card'; card.textContent = w.ru;
                card.dataset.pairId = w.en; card.onclick = () => handleCardClick(card);
                ruCol.appendChild(card);
            });
        }
        
        function nextWritingWord() {
            const word = pool.pop();
            document.getElementById('target-ru').textContent = word.ru;
            document.getElementById('user-input').value = '';
            document.getElementById('target-ru').classList.remove('is-wrong');
        }
    </script>
</body>
</html>
