<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnCa Pro</title>
    <style>
        :root {
            --icon-red: #b31d35;
            --icon-green: #108a50;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, sans-serif;
            margin: 0; padding: 20px; min-height: 100vh;
            background: url('bg_menu.png') no-repeat center center fixed;
            background-size: cover;
            transition: background 0.5s ease;
            display: flex; flex-direction: column; align-items: center;
        }

        /* МЕНЮ */
        #menu-screen { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; text-align: center; }
        .menu-title { font-size: 54px; font-weight: 900; margin: 20px 0; letter-spacing: -2px; }
        .t-en, .t-me { color: var(--icon-green); }
        .t-ca, .t-nyu { color: var(--icon-red); }

        .settings-panel {
            background: url('ui_frame.png') no-repeat center; background-size: 100% 100%;
            padding: 30px; margin-bottom: 25px;
            display: flex; flex-direction: column; gap: 15px; font-weight: bold;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; color: #333; }
        select { border: 1px solid #ccc; background: rgba(255,255,255,0.8); padding: 5px; border-radius: 8px; }

        .menu-btn {
            height: 90px; border-radius: 20px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 15px; font-weight: bold; font-size: 18px; transition: 0.3s;
        }
        .menu-btn img { height: 50px; }
        .btn-listen { background: var(--icon-green); color: white; }
        .btn-classic { background: var(--icon-red); color: white; }
        .btn-write { background: white; border: 3px solid var(--icon-green); color: var(--icon-green); }

        /* ИГРА */
        #game-ui { display: none; width: 100%; max-width: 600px; }
        .stats-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { 
            flex: 1; height: 50px; background: rgba(255,255,255,0.9); border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold;
        }
        .stat-card img { height: 25px; }

        .columns-container { display: flex; gap: 12px; }
        .column { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        
        .card {
            min-height: 90px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            padding: 15px; text-align: center; font-size: 14px; font-weight: 700;
            background: url('card_gray.png') no-repeat center; background-size: 100% 100%;
        }
        .card.is-correct { background: url('card_en.png') no-repeat center !important; background-size: 100% 100% !important; color: white; }
        .card.is-wrong { background: url('card_ru.png') no-repeat center !important; background-size: 100% 100% !important; color: white; }
        .card.selected { transform: scale(1.05); filter: brightness(1.2); }
        .card.matched { opacity: 0.5; pointer-events: none; }

        .hidden-en { color: transparent !important; position: relative; }
        .hidden-en::after { content: ''; background: url('listen_icon.png') no-repeat center; background-size: contain; width: 35px; height: 35px; position: absolute; }

        #writing-mode { display: none; flex-direction: column; align-items: center; gap: 20px; }
        .write-card { 
            width: 100%; padding: 50px 20px; background: url('ui_frame.png') no-repeat center;
            background-size: 100% 100%; text-align: center; font-size: 22px; font-weight: bold; color: var(--icon-red);
        }
        .write-input { width: 100%; padding: 18px; border-radius: 15px; border: 2px solid #ccc; font-size: 18px; text-align: center; outline: none; }

        .bottom-nav { width: 100%; display: flex; justify-content: center; margin-top: 30px; }
        .back-menu-btn {
            background: url('ui_frame.png') no-repeat center; background-size: 100% 100%;
            padding: 15px 40px; cursor: pointer; font-weight: 900; font-size: 18px;
        }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .error-anim { animation: shake 0.4s; }
    </style>
</head>
<body>
    <!-- Содержимое body и script остаются такими же, как в прошлом сообщении -->
    <div id="menu-screen">
        <div class="menu-title"><span class="t-en">En</span><span class="t-ca">Ca</span></div>
        <div class="settings-panel">
            <div class="setting-row"><span>Скорость:</span><select id="speech-rate"><option value="0.6">Slow</option><option value="0.9" selected>Normal</option><option value="1.2">Fast</option></select></div>
            <div class="setting-row"><span>Голос:</span><select id="voice-gender"><option value="female">Female</option><option value="male">Male</option></select></div>
        </div>
        <button class="menu-btn btn-listen" onclick="startGame('listening')"><img src="listen_icon.png">НА СЛУХ</button>
        <button class="menu-btn btn-classic" onclick="startGame('classic')"><img src="cards_icon.png">КЛАССИКА</button>
        <button class="menu-btn btn-write" onclick="startGame('writing')"><img src="keyboard_icon.png">ПИСЬМО</button>
    </div>

    <div id="game-ui">
        <div class="stats-container">

            <div class="stat-card"><img src="bad.png"><span id="wrong-count">0</span></div>
            <div class="stat-card" style="color: var(--icon-red)">📦 <span id="pool-count">0</span></div>
        </div>
        <div id="matching-columns" class="columns-container"><div id="en-column" class="column"></div><div id="ru-column" class="column"></div></div>
        <div id="writing-mode"><div id="target-ru" class="write-card">...</div><input type="text" id="user-input" class="write-input" placeholder="Type in English..." autocomplete="off"></div>
        <div class="bottom-nav"><div class="back-menu-btn" onclick="backToMenu()"><span class="t-me">Ме</span><span class="t-nyu">Ню</span></div></div>

            { en: "Drop it", ru: "Оставь это" }, { en: "Could I have", ru: "могу ли я" },
            { en: "That’s why", ru: "поэтому" }, { en: "Don’t trip", ru: "не твое дело" },
            { en: "he didn make it", ru: "он не выжил" }, { en: "still young", ru: "всё ещё молодой" },
            { en: "I am boring", ru: "я скучный" }, { en: "I’m Broke", ru: "нет денег" },
            { en: "I’m running late", ru: "я опаздываю" }, { en: "That works", ru: "договорились" },
            { en: "I am interesting", ru: "я интересный" }, { en: "Make yourself at home", ru: "как дома" },
            { en: "It slipped my mind", ru: "Вылетело из головы" }, { en: "That's on me", ru: "Это из-за меня" },
            { en: "Let me get back to you", ru: "На связи" }, { en: "I'm all set", ru: "Нет, спасибо" },
            { en: "It is what it is", ru: "Что есть, то есть" }
        ];

        let pool = [], currentGameMode = '', correctCount = 0, wrongCount = 0, selectedCards = [];

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = parseFloat(document.getElementById('speech-rate').value);
            const gender = document.getElementById('voice-gender').value;
            msg.voice = window.speechSynthesis.getVoices().find(v => v.lang.startsWith('en') && (gender === 'male' ? v.name.includes('Male') : v.name.includes('Female'))) || null;
            window.speechSynthesis.speak(msg);
        }

        function startGame(mode) {
            currentGameMode = mode; correctCount = 0; wrongCount = 0;
            pool = [...allWords].sort(() => Math.random() - 0.5);
            const bgs = { listening: 'bg_listen.png', classic: 'bg_classic.png', writing: 'bg_write.png' };
            document.body.style.background = `url('${bgs[mode]}') no-repeat center center fixed`;
            document.body.style.backgroundSize = 'cover';
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            if (mode === 'writing') {
                document.getElementById('matching-columns').style.display = 'none';
                document.getElementById('writing-mode').style.display = 'flex'; nextWritingWord();
            } else {
                document.getElementById('matching-columns').style.display = 'flex';
                document.getElementById('writing-mode').style.display = 'none'; initMatchingRound();
            }
        }

        function backToMenu() {
            window.speechSynthesis.cancel();
            document.body.style.background = "url('bg_menu.png') no-repeat center center fixed";
            document.body.style.backgroundSize = 'cover';
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
        }

        function initMatchingRound() {
            if (pool.length === 0) return backToMenu();
            const enCol = document.getElementById('en-column'); const ruCol = document.getElementById('ru-column');
            enCol.innerHTML = ''; ruCol.innerHTML = '';
            let roundWords = pool.splice(0, 6);
            let shuffledRu = [...roundWords].sort(() => Math.random() - 0.5);
            roundWords.forEach(w => enCol.appendChild(createCard(w.en, w.en, 'en')));
            shuffledRu.forEach(w => ruCol.appendChild(createCard(w.ru, w.en, 'ru')));
            document.getElementById('pool-count').textContent = pool.length;
        }

        function createCard(text, pairId, lang) {
            const card = document.createElement('div'); card.className = 'card';
            if (lang === 'en' && currentGameMode === 'listening') card.classList.add('hidden-en');
            card.textContent = text; card.dataset.lang = lang; card.dataset.pairId = pairId;
            card.onclick = () => handleCardClick(card); return card;
        }

        function handleCardClick(card) {
            if (card.dataset.lang === 'en' && (card.classList.contains('matched') || card.classList.contains('selected'))) { speak(card.textContent); return; }
            if (card.classList.contains('matched')) return;
            if (card.dataset.lang === 'en') speak(card.textContent);
            card.classList.add('selected'); selectedCards.push(card);
            if (selectedCards.length === 2) {
                const [c1, c2] = selectedCards;
                if (c1.dataset.pairId === c2.dataset.pairId) {
                    correctCount++; c1.classList.remove('hidden-en', 'selected'); c2.classList.remove('selected');
                    c1.classList.add('is-correct', 'matched'); c2.classList.add('is-correct', 'matched');
                    if (document.querySelectorAll('.card:not(.matched)').length === 0) setTimeout(initMatchingRound, 800);
                } else {
                    wrongCount++; c1.classList.add('is-wrong', 'error-anim'); c2.classList.add('is-wrong', 'error-anim');
                    setTimeout(() => { c1.classList.remove('selected', 'is-wrong', 'error-anim'); c2.classList.remove('selected', 'is-wrong', 'error-anim'); }, 500);
                }
                selectedCards = [];
                document.getElementById('correct-count').textContent = correctCount;
                document.getElementById('wrong-count').textContent = wrongCount;
            }
        }

        function nextWritingWord() {
            if (pool.length === 0) return backToMenu();
            currentWritingWord = pool.pop(); document.getElementById('target-ru').textContent = currentWritingWord.ru;
            document.getElementById('user-input').value = ''; document.getElementById('pool-count').textContent = pool.length;
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (e.target.value.trim().toLowerCase() === currentWritingWord.en.toLowerCase()) {
                    correctCount++; speak(currentWritingWord.en); nextWritingWord();
                } else { wrongCount++; alert('Correct: ' + currentWritingWord.en); }
                document.getElementById('correct-count').textContent = correctCount;
                document.getElementById('wrong-count').textContent = wrongCount;
            }
        });
        window.speechSynthesis.onvoiceschanged = () => {};
