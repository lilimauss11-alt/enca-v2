<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnCa Pro</title>
    <style>
        :root {
            --icon-red: #b31d35;
            --icon-green: #108a50;
            --neutral-gray: #d1d1d1;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, sans-serif;
            margin: 0; padding: 20px; min-height: 100vh;
            background: url('bg_menu.png') no-repeat center center fixed;
            background-size: cover;
            transition: background 0.5s ease;
            display: flex; flex-direction: column; align-items: center;
            perspective: 1200px;
            overflow-x: hidden;
        }

        .flip-container { 
            width: 100%; max-width: 600px; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            transform-style: preserve-3d; 
            position: relative;
        }
        .flipping { transform: rotateY(180deg); }

        #menu-screen, #game-ui { backface-visibility: hidden; }
        #game-ui { transform: rotateY(180deg); display: none; position: absolute; top: 0; width: 100%; }

        #menu-screen { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; text-align: center; }
        .menu-title { font-size: 54px; font-weight: 900; margin: 20px 0; letter-spacing: -2px; }
        .t-en, .t-me { color: var(--icon-green); }
        .t-ca, .t-nyu { color: var(--icon-red); }

        .settings-panel {
            background: url('ui_frame.png') no-repeat center; background-size: 100% 100%;
            padding: 25px; margin-bottom: 25px;
            display: flex; flex-direction: column; gap: 12px; font-weight: bold;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; color: #333; font-size: 14px; }
        select { border: 1px solid #ccc; background: rgba(255,255,255,0.8); padding: 5px; border-radius: 8px; width: 100px; }

        .menu-btn {
            height: 90px; border-radius: 20px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 15px; font-weight: bold; font-size: 18px; transition: 0.3s;
            background: url('ui_frame.png') no-repeat center; background-size: 100% 100%;
            position: relative; overflow: hidden;
        }
        .menu-btn::before { content: ''; position: absolute; top: 10%; left: 5%; right: 5%; bottom: 10%; border-radius: 15px; z-index: 0; opacity: 0.8; }
        .btn-ear::before { background: var(--icon-green); }
        .btn-classic::before { background: var(--icon-red); }
        .btn-write::before { background: white; border: 2px solid var(--icon-green); }
        
        .menu-btn span, .menu-btn img { z-index: 1; color: white; }
        .btn-write span { color: var(--icon-green); }
        .menu-btn img { height: 45px; }

        .stats-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { 
            flex: 1; height: 50px; background: rgba(255,255,255,0.9); border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold;
        }
        .stat-card img { height: 25px; }

        .columns-container { display: flex; gap: 12px; }
        .column { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        
        .card {
            min-height: 90px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            padding: 15px; text-align: center; font-size: 14px; font-weight: 700;
            background: url('card_gray.png') no-repeat center; background-size: 100% 100%;
            color: #333;
        }
        .card.selected { transform: scale(1.05); filter: brightness(0.8); outline: 4px solid var(--neutral-gray); border-radius: 18px; }
        
        .card.is-correct { background: url('card_en.png') no-repeat center !important; background-size: 100% 100% !important; border-radius: 18px; }
        .card.is-wrong { background: url('card_ru.png') no-repeat center !important; background-size: 100% 100% !important; border-radius: 18px; }
        .card.matched { opacity: 0.4; pointer-events: none; filter: grayscale(0.5); }

        .hidden-en { color: transparent !important; position: relative; }
        .hidden-en::after { content: ''; background: url('listen_icon.png') no-repeat center; background-size: contain; width: 35px; height: 35px; position: absolute; }

        #writing-mode { display: none; flex-direction: column; align-items: center; gap: 20px; }
        .write-card { 
            width: 100%; padding: 50px 20px; background: url('ui_frame.png') no-repeat center;
            background-size: 100% 100%; text-align: center; font-size: 22px; font-weight: bold; 
            color: #000; /* Вопрос всегда черным */
            transition: background 0.3s ease;
        }
        .write-input { 
            width: 100%; padding: 18px; border-radius: 15px; border: 2px solid #ccc; 
            font-size: 18px; text-align: center; outline: none; background: rgba(255,255,255,0.9);
        }

        .bottom-nav { width: 100%; display: flex; justify-content: center; margin-top: 30px; }
        .back-menu-btn {
            background: url('ui_frame.png') no-repeat center; background-size: 100% 100%;
            padding: 15px 40px; cursor: pointer; font-weight: 900; font-size: 18px; color: #333;
        }
    </style>
</head>
<body>

    <div id="main-wrapper" class="flip-container">
        <div id="menu-screen">
            <div class="menu-title"><span class="t-en">En</span><span class="t-ca">Ca</span></div>
            <div class="settings-panel">
                <div class="setting-row"><span data-t="speed">Скорость:</span><select id="speech-rate"><option value="0.6">Slow</option><option value="0.9" selected>Normal</option><option value="1.2">Fast</option></select></div>
                <div class="setting-row"><span data-t="voice">Голос:</span><select id="voice-gender"><option value="female">Female</option><option value="male">Male</option></select></div>
                <div class="setting-row"><span data-t="lang">Язык:</span><select id="ui-lang" onchange="updateUILanguage()"><option value="ru">Русский</option><option value="en">English</option></select></div>
            </div>
            <button class="menu-btn btn-ear" onclick="startGame('listening')"><img src="listen_icon.png"><span data-t="btn_ear">НА СЛУХ</span></button>
            <button class="menu-btn btn-classic" onclick="startGame('classic')"><img src="cards_icon.png"><span data-t="btn_classic">КЛАССИКА</span></button>
            <button class="menu-btn btn-write" onclick="startGame('writing')"><img src="keyboard_icon.png"><span data-t="btn_write">ПИСЬМО</span></button>
        </div>

        <div id="game-ui">
            <div class="stats-container">
                <div class="stat-card"><img src="excellent.png"><span id="correct-count">0</span></div>
                <div class="stat-card"><img src="bad.png"><span id="wrong-count">0</span></div>
                <div class="stat-card"><img src="cards_icon.png" style="height:20px;"><span id="pool-count">0</span></div>
            </div>
            <div id="matching-columns" class="columns-container"><div id="en-column" class="column"></div><div id="ru-column" class="column"></div></div>
            <div id="writing-mode"><div id="target-ru" class="write-card">...</div><input type="text" id="user-input" class="write-input" placeholder="..." autocomplete="off"></div>
            <div class="bottom-nav"><div class="back-menu-btn" onclick="backToMenu()"><span id="back-btn-text"><span class="t-me">Ме</span><span class="t-nyu">Ню</span></span></div></div>
        </div>
    </div>

        let pool = [], currentGameMode = '', correctCount = 0, wrongCount = 0, selectedCards = [];
        let currentWritingWord = null;

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = parseFloat(document.getElementById('speech-rate').value);
            const gender = document.getElementById('voice-gender').value;
            msg.voice = window.speechSynthesis.getVoices().find(v => v.lang.startsWith('en') && (gender === 'male' ? v.name.includes('Male') : v.name.includes('Female'))) || null;
            window.speechSynthesis.speak(msg);
        }

        function startGame(mode) {
            const wrapper = document.getElementById('main-wrapper');
            wrapper.classList.add('flipping');
            setTimeout(() => {
                currentGameMode = mode; pool = [...allWords].sort(() => Math.random() - 0.5);
                const bgs = { listening: 'bg_listen.png', classic: 'bg_classic.png', writing: 'bg_write.png' };
                document.body.style.background = `url('${bgs[mode]}') no-repeat center center fixed`;
                document.body.style.backgroundSize = 'cover';
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                if (mode === 'writing') {
                    document.getElementById('matching-columns').style.display = 'none';
                    document.getElementById('writing-mode').style.display = 'flex'; nextWritingWord();
                } else {
                    document.getElementById('matching-columns').style.display = 'flex';
                    document.getElementById('writing-mode').style.display = 'none'; initMatchingRound();
                }
            }, 400);
        }

        function backToMenu() {
            const wrapper = document.getElementById('main-wrapper');
            wrapper.classList.remove('flipping');
            setTimeout(() => {
                window.speechSynthesis.cancel();
                correctCount = 0; wrongCount = 0;
                document.getElementById('correct-count').textContent = '0';
                document.getElementById('wrong-count').textContent = '0';
                document.body.style.background = "url('bg_menu.png') no-repeat center center fixed";
                document.body.style.backgroundSize = 'cover';
                document.getElementById('game-ui').style.display = 'none';
                document.getElementById('menu-screen').style.display = 'flex';
            }, 400);
        }

        function initMatchingRound() {
            if (pool.length === 0) return backToMenu();
            const enCol = document.getElementById('en-column'); const ruCol = document.getElementById('ru-column');
            enCol.innerHTML = ''; ruCol.innerHTML = '';
            let roundWords = pool.splice(0, 6);
            let shuffledRu = [...roundWords].sort(() => Math.random() - 0.5);
            roundWords.forEach(w => enCol.appendChild(createCard(w.en, w.en, 'en')));
            shuffledRu.forEach(w => ruCol.appendChild(createCard(w.ru, w.en, 'ru')));
            document.getElementById('pool-count').textContent = pool.length;
        }

        function createCard(text, pairId, lang) {
            const card = document.createElement('div'); card.className = 'card';
            if (lang === 'en' && currentGameMode === 'listening') card.classList.add('hidden-en');
            card.textContent = text; card.dataset.lang = lang; card.dataset.pairId = pairId;
            card.onclick = () => handleCardClick(card); return card;
        }

        function handleCardClick(card) {
            if (card.classList.contains('matched')) return;
            const sameLangSelected = selectedCards.find(c => c.dataset.lang === card.dataset.lang);
            if (sameLangSelected) {
                if (sameLangSelected === card) { card.classList.remove('selected'); selectedCards = []; return; }
                sameLangSelected.classList.remove('selected'); selectedCards = selectedCards.filter(c => c !== sameLangSelected);
            }
            if (card.dataset.lang === 'en') speak(card.textContent);
            card.classList.add('selected'); selectedCards.push(card);
            if (selectedCards.length === 2) {
                const [c1, c2] = selectedCards;
                if (c1.dataset.pairId === c2.dataset.pairId) {
                    correctCount++; c1.classList.remove('hidden-en', 'selected'); c2.classList.remove('selected');
                    c1.classList.add('is-correct', 'matched'); c2.classList.add('is-correct', 'matched');
                    if (document.querySelectorAll('.card:not(.matched)').length === 0) setTimeout(initMatchingRound, 800);
                } else {
                    wrongCount++; c1.classList.add('is-wrong', 'error-anim'); c2.classList.add('is-wrong', 'error-anim');
                    setTimeout(() => { c1.classList.remove('selected', 'is-wrong', 'error-anim'); c2.classList.remove('selected', 'is-wrong', 'error-anim'); }, 500);
                }
                selectedCards = [];
                document.getElementById('correct-count').textContent = correctCount;
                document.getElementById('wrong-count').textContent = wrongCount;
            }
        }

        function nextWritingWord() {
            if (pool.length === 0) return backToMenu();
            currentWritingWord = pool.pop(); 
            document.getElementById('target-ru').textContent = currentWritingWord.ru;
            const input = document.getElementById('user-input');
            input.value = ''; 
            document.getElementById('pool-count').textContent = pool.length;
            const card = document.getElementById('target-ru');
            card.style.background = "url('ui_frame.png') no-repeat center";
            card.style.backgroundSize = "100% 100%";
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const card = document.getElementById('target-ru');
                const input = document.getElementById('user-input');
                
                if (input.value.trim().toLowerCase() === currentWritingWord.en.toLowerCase()) {
                    correctCount++; 
                    speak(currentWritingWord.en);
                    card.style.background = "url('card_en.png') no-repeat center";
                    card.style.backgroundSize = "100% 100%";
                    setTimeout(nextWritingWord, 600);
                } else { 
                    wrongCount++; 
                    card.style.background = "url('card_ru.png') no-repeat center";
                    card.style.backgroundSize = "100% 100%";
                    input.value = ''; // Очистка при ошибке
                    setTimeout(() => {
                        card.style.background = "url('ui_frame.png') no-repeat center";
                        card.style.backgroundSize = "100% 100%";
                    }, 600);
                }
                document.getElementById('correct-count').textContent = correctCount;
                document.getElementById('wrong-count').textContent = wrongCount;
            }
        });
        window.speechSynthesis.onvoiceschanged = () => {};
    </script>
</body>
</html>
